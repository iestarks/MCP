[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-gate-mcp"
version = "0.1.0"
description = "Policy-as-code AI-SDLC gates (prompt review, tool manifest diffing, MCP server vetting, eval regression) exposed as an MCP server and CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed for `run-evals --mode live` against a LangChain-based agent.
live = ["langchain>=0.2.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
policy-gate = "policy_gate.cli:main"

[tool.setuptools.packages.find]
include = ["policy_gate*"]
