# Policy-as-code rules for Gate 2: tool manifest diffing.
# Every tool exposed to the agent must be explicitly classified here.
# risk: low | medium | high | critical
# Any tool NOT listed here always fails the gate (fail closed).
version: 1

tools:
  list_directory:
    risk: low
    capability: filesystem-read
    justification: "Read-only directory listing."
  read_text_file:
    risk: low
    capability: filesystem-read
    justification: "Read-only file access, bounded by max_chars."
  write_text_file:
    risk: high
    capability: filesystem-write
    justification: "Writes arbitrary files anywhere the process can reach; path is not sandboxed."
  run_command:
    risk: critical
    capability: shell-execution
    justification: "Arbitrary shell execution; highest blast radius tool in the manifest."
  recall_prior_prompts:
    risk: low
    capability: local-memory-read
    justification: >
      Read-only lookup against the agent's own local encrypted SQLite prompt
      history. With no query, scoped to the current session id; with a
      query, does a local keyword-overlap relevance search across all
      sessions (still no filesystem path traversal, no shell execution,
      no network egress -- everything stays within the local SQLite file).

  # CrewAI agent tools
  search_web:
    risk: medium
    capability: network-egress
    justification: >
      Issues outbound HTTP requests to arbitrary search engine endpoints.
      Results are read-only and summarised; no writes or code execution.
      Medium risk because network egress can be used for SSRF or data
      exfiltration if the query is attacker-controlled.
  read_file:
    risk: low
    capability: filesystem-read
    justification: "Read-only file access bounded by max_chars; no writes or shell execution."
  execute_python:
    risk: critical
    capability: code-execution
    justification: >
      Runs arbitrary Python code in a subprocess. Equivalent blast radius to
      shell execution: full read/write filesystem access, network egress,
      process spawning. Must be sandboxed in production (e.g. gVisor / nsjail).

  # Vault observability agent tools
  get_cluster_snapshot:
    risk: low
    capability: vault-observability
    justification: "Reads Vault health state without changing cluster configuration."
  seal_node:
    risk: high
    capability: vault-emergency-operation
    justification: "Can make a Vault node unavailable and is restricted to explicitly authorized admin sessions."
  unseal_node:
    risk: high
    capability: vault-emergency-operation
    justification: "Uses recovery material and is restricted to explicitly authorized admin sessions."
  fetch_keyvault_metadata:
    risk: low
    capability: vault-audit-metadata
    justification: "Returns configured metadata names and dry-run state, not secret values."
  run_vault_command:
    risk: critical
    capability: vault-cli-execution
    justification: >
      Executes Vault CLI operations. Read-only sessions enforce command
      classification before subprocess execution and Vault ACLs provide a
      second authorization boundary.
  run_vault_api:
    risk: critical
    capability: vault-api-execution
    justification: >
      Executes structured Vault API operations. Read-only sessions allow only
      GET and LIST before transport and Vault ACLs provide defense in depth.
  configure_identity_group:
    risk: high
    capability: vault-identity-write
    justification: "Changes Vault identity group policy and membership and is not exposed to read-only sessions."
  get_operator_crds:
    risk: low
    capability: vault-operator-discovery
    justification: "Returns a static list of supported operator CRD kinds without cluster access."
  suggest_operator_crd:
    risk: low
    capability: vault-operator-suggestion
    justification: "Renders a Kubernetes manifest for review but never applies it."

# Risk tiers that require a sign-off entry (in tool_manifest_review_log.yaml)
# whenever a tool at that tier is newly added, or its signature/description
# changes.
review_required_risk_tiers:
  - high
  - critical
