# Append one entry here every time a PR intentionally changes a reviewed
# system prompt. The prompt-review gate fails a PR that changes a prompt
# baseline without a corresponding entry here.
#
# entries:
#   - baseline: usea/system_prompt.baseline.txt
#     reviewer: "<github-handle>"
#     date: "2026-07-28"
#     pr: "#123"
#     summary: "Why the prompt changed"
entries:
  - baseline: usea/system_prompt.baseline.txt
    reviewer: "iestarks"
    date: "2026-07-29"
    pr: "N/A - local privacy-mode feature review"
    summary: >
      Added a "Local Privacy Mode Policy" block to system_content, injected
      only when --privacy / privacy_mode=True is active. Instructs the model
      not to read/quote/summarize credential-secret files, not to dump env
      vars/credentials, and not to suggest sending data to external services
      beyond what's required. Reviewed against policies/prompt_policy.yaml:
      no forbidden patterns matched, required "mask"/"risk" patterns present,
      1311 chars (under the 4000 char limit).
  - baseline: usea/system_prompt.baseline.txt
    reviewer: "iestarks"
    date: "2026-07-30"
    pr: "N/A - local encrypted prompt memory feature review"
    summary: >
      Added a "Local Memory Policy" block to system_content, injected only
      when the local encrypted prompt-memory store (prompt_memory.py) is
      available. Tells the model that prior prompts/responses can be
      recalled via the new recall_prior_prompts tool, and that stored
      history is encrypted at rest locally and never sent to LangSmith or
      any third party. Reviewed against policies/prompt_policy.yaml: no
      forbidden patterns matched, required "mask"/"risk" patterns still
      present (from the unchanged General Policy block), 1598 chars total
      (under the 4000 char limit).
  - baseline: usea/system_prompt.baseline.txt
    reviewer: "iestarks"
    date: "2026-07-30"
    pr: "N/A - auto-recall + agentic memory search follow-up"
    prompt_sha256: "2c7657f68af673b2ffc700e59aaa89b5c141468153ea95c0d67b6db2a3617ac7"
    summary: >
      Reworded the "Local Memory Policy" block: session ids are now
      auto-assigned per CLI run instead of a fixed default, so continuity
      comes from a new cross-session keyword-overlap relevance search
      (PromptMemoryStore.find_related) instead of session-id matching.
      Relevant prior context is now auto-recalled and injected as a
      separate message before the instruction (not part of this static
      system_content block); the policy text now also tells the model it
      can call recall_prior_prompts with an explicit search query for
      on-demand agentic lookups. Reviewed against
      policies/prompt_policy.yaml: no forbidden patterns matched, required
      "mask"/"risk" patterns still present, 1739 chars total (under the
      4000 char limit).
  - baseline: usea/system_prompt.baseline.txt
    reviewer: "iestarks"
    date: "2026-08-07"
    pr: "N/A - confidential information authorization review"
    prompt_sha256: "77cacc5b96c6b320efa0f7b1eaca73ad1a81c7f2b78ce7a54038e098e4f93a7b"
    summary: >
      Added both outcomes of USEA's mandatory confidential-information
      disclosure policy to the statically reviewed prompt surface. Authorized
      callers may discuss implementation details while still masking secrets;
      unauthorized callers must not reveal or retrieve authentication,
      authorization, source, prompt, architecture, configuration, deployment,
      security, memory, data-store, secret, or admin-claim details. Reviewed
      against prompt_policy.yaml: no forbidden patterns matched, required
      mask/risk patterns remain present, and the assembled prompt is 2511
      characters (under the 4000-character limit).
  - baseline: crewai/system_prompt.baseline.txt
    reviewer: "iestarks"
    date: "2026-08-15"
    pr: "N/A - initial crewai scaffolding"
    prompt_sha256: "6a897c7369546ee23e6eff66f8d81bb60afc39b4b9b6debba4f88f1996b0f907"
    summary: >
      Initial CrewAI agent backstory. Instructs the assistant to explain risk
      before executing code or reading sensitive files, and to mask sensitive
      values. Both required patterns (mask, risk) are present. No forbidden
      patterns matched. 652 characters (well under the 4000-char limit).
